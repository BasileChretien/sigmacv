# Automated dependency monitoring (OpenSSF Scorecard "Dependency-Update-Tool" +
# Best Practices dependency-monitoring criterion). Dependabot opens PRs for
# security and version updates; CI (typecheck + ~800 tests + build) gates them.
version: 2
updates:
  # npm runtime + dev dependencies.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      # Batch low-risk minor/patch bumps into a single PR to cut review noise;
      # majors still arrive as individual PRs so breaking changes stay visible.
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    labels:
      - "dependencies"

  # Pinned GitHub Actions (keeps the SHA-pinned workflow actions current).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      # Batch minor/patch action bumps into a single PR (e.g. the codeql-action
      # init/analyze/upload-sarif steps, which otherwise open three separate PRs
      # for the same version); majors still arrive individually so breaking
      # changes stay visible.
      actions-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    labels:
      - "dependencies"
      - "ci"

  # Docker base images (Dockerfile). Keeps the Node builder image and any other
  # base image current; without this they silently age past their security
  # updates because nothing else watches them.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "ci"
    ignore:
      # The Playwright runtime image tag is bound to the exact `playwright`
      # version in package.json (tests/dockerfile-playwright-sync.test.ts fails
      # if they drift). Bumping it on its own would always open a red PR, so it
      # rides along with the npm Playwright bump instead.
      - dependency-name: "mcr.microsoft.com/playwright"

      # The builder's Node MAJOR is not a free-floating dependency either: it is
      # pinned to whatever the Playwright runtime image ships (v1.62.1-noble ->
      # Node v24.18.1, verified 2026-09-02). Letting Docker Hub's cadence drive it
      # reintroduces the build-on-one-major / run-on-another bug the comment above
      # the builder FROM records fixing — which is exactly what #371 (node 24 -> 26)
      # proposed, and CI could not have caught it because no workflow builds the
      # Dockerfile. Move this major deliberately, together with the runtime image,
      # when Playwright ships a base image on a newer Node.
      #
      # Scoped to majors: minor/patch bumps inside the line still arrive, so
      # security fixes within 24.x are NOT blocked by this.
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]

  # Docker Compose services (docker-compose*.yml). The `docker` ecosystem above
  # only scans the Dockerfile — Compose is a SEPARATE ecosystem — so without this
  # entry the internet-facing Caddy plus Postgres, ClickHouse, Plausible and
  # Metabase are watched by nothing at all.
  #
  # Read these PRs before merging. `scripts/deploy.sh` runs a bare
  # `docker compose up -d` with NO service filter, so a merged image bump is
  # applied on the very next deploy — Compose recreates every service whose
  # image changed, not just `app`. That makes a `postgres` or
  # `clickhouse-server` MAJOR genuinely dangerous: it is a data migration
  # (pg_upgrade / dump + restore), so merging one quietly means the next deploy
  # recreates the container against a data directory the new major refuses to
  # open. Majors arrive as individual PRs precisely so they stay visible.
  #
  # (Contrast the Caddyfile, which is bind-mounted: editing it changes no
  # config hash, so `up -d` does NOT recreate caddy — deploy.sh validates and
  # reloads it explicitly instead. Image tags and mounted files behave
  # differently; don't reason about one from the other.)
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      compose-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    labels:
      - "dependencies"
      - "ci"
    ignore:
      # Postgres MAJORS are a data migration, never a merge. The app DB,
      # plausible_db and metabase_db all share this tag and all hold live v16
      # data directories; Postgres refuses to start against an older major's
      # data, and deploy.sh runs a bare `docker compose up -d`, so merging a
      # major means the next deploy takes all three down at once (#376 proposed
      # exactly that). Postgres 16 is supported to Nov 2028 and `16-alpine` is a
      # floating tag, so 16.x patches still arrive on image pull — nothing is
      # lost by ignoring majors here. Do the eventual move deliberately: dump,
      # restore onto the new major, verify, then edit these pins by hand.
      - dependency-name: "postgres"
        update-types: ["version-update:semver-major"]

      # ClickHouse is not ours to choose at all: it is Plausible's events store,
      # and Plausible CE pins the pairing itself — v3.2.1's own compose ships
      # `clickhouse/clickhouse-server:24.12-alpine`, which is why this repo
      # matches it. Bumping it alone runs Plausible against a ClickHouse it was
      # never tested against, and ClickHouse does not support downgrading once
      # the on-disk format moves, so it is not a safe experiment (#375). Ignored
      # outright rather than majors-only, because ANY deviation from upstream's
      # tag is the same mistake. It moves when ghcr.io/plausible/community-
      # edition moves — adopt whatever ClickHouse that release pins.
      - dependency-name: "clickhouse/clickhouse-server"
