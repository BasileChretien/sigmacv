# Automated dependency monitoring (OpenSSF Scorecard "Dependency-Update-Tool" +
# Best Practices dependency-monitoring criterion). Dependabot opens PRs for
# security and version updates; CI (typecheck + ~800 tests + build) gates them.
version: 2
updates:
  # npm runtime + dev dependencies.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      # Batch low-risk minor/patch bumps into a single PR to cut review noise;
      # majors still arrive as individual PRs so breaking changes stay visible.
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    labels:
      - "dependencies"

  # Pinned GitHub Actions (keeps the SHA-pinned workflow actions current).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      # Batch minor/patch action bumps into a single PR (e.g. the codeql-action
      # init/analyze/upload-sarif steps, which otherwise open three separate PRs
      # for the same version); majors still arrive individually so breaking
      # changes stay visible.
      actions-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    labels:
      - "dependencies"
      - "ci"

  # Docker base images (Dockerfile). Keeps the Node builder image and any other
  # base image current; without this they silently age past their security
  # updates because nothing else watches them.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "ci"
    ignore:
      # The Playwright runtime image tag is bound to the exact `playwright`
      # version in package.json (tests/dockerfile-playwright-sync.test.ts fails
      # if they drift). Bumping it on its own would always open a red PR, so it
      # rides along with the npm Playwright bump instead.
      - dependency-name: "mcr.microsoft.com/playwright"

  # Docker Compose services (docker-compose*.yml). The `docker` ecosystem above
  # only scans the Dockerfile — Compose is a SEPARATE ecosystem — so without this
  # entry the internet-facing Caddy plus Postgres, ClickHouse, Plausible and
  # Metabase are watched by nothing at all.
  #
  # Two things to keep in mind when one of these PRs lands:
  #   * `scripts/deploy.sh` only recreates the `app` container. A merged image
  #     bump changes nothing in production until the service is recreated
  #     explicitly (`docker compose up -d <service>`) — the same trap as
  #     Caddyfile edits.
  #   * A `postgres` or `clickhouse-server` MAJOR is a data migration
  #     (pg_upgrade / dump + restore), not a routine bump. Majors still arrive as
  #     individual PRs so they stay visible; read them, don't merge on autopilot.
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      compose-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    labels:
      - "dependencies"
      - "ci"
