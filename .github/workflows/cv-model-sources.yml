# Monthly check that each CV model's funder documents are still current.
#
# A CV model is read against the funder's own rules (src/lib/canonical/
# cvModelSources.ts), and funders reissue those rules with each call. This run
# turns red when a reading is due again, when a document says it is gone, or
# when the funder's page stopped linking to it (a revised version or a new
# edition has probably replaced it). A red run is the
# to-do: docs/CV-MODELS.md says what to update for each problem. A site that
# refuses robots, fails (5xx) or does not answer is reported in the job summary
# without failing the run.
#
# Deliberately NOT wired into ci.yml, for the same reason as audit.yml: a
# funder's website would otherwise turn every unrelated PR red.
name: CV model sources

on:
  schedule:
    - cron: "23 5 1 * *" # the 1st of each month, 05:23 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cv-model-sources
  cancel-in-progress: true

jobs:
  check:
    name: Funder documents
    runs-on: ubuntu-latest
    # One retry per request keeps the worst case (every host hanging) near 20 minutes.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      # `npm ci` runs `postinstall: prisma generate`, which needs no database.
      - name: Install dependencies
        run: npm ci

      - name: Check the documents each model was read against
        run: npm run models:sources
