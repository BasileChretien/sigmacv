name: E2E

# Runs on every PR and on main. The journeys were validated green first (#343,
# #344) after a long spell where they could not run at all — the workflow pointed
# at a database the `_e2e` guardrail rejected, so global setup threw before a
# single journey started.
#
# Deliberately NO `paths:` filter. If this is added to branch protection as a
# required check, a filter would deadlock any PR that doesn't touch the filtered
# paths: the job never runs, so the required check never reports, and the PR can
# never merge. Running it on every PR costs about a minute; that is the cheaper
# side of the trade. This matches ci.yml, which also filters nothing.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright journeys
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sigmacv
          POSTGRES_PASSWORD: sigmacv
          POSTGRES_DB: sigmacv_e2e
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U sigmacv"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      # E2E runs the app in dev mode (playwright.config webServer) so env.ts's
      # production guards don't fire and OPENALEX_API_BASE (fixture server) is honored.
      DATABASE_URL: "postgresql://sigmacv:sigmacv@localhost:5432/sigmacv_e2e"
      AUTH_SECRET: "ci-e2e-secret-not-a-real-secret"
      AUTH_URL: "http://localhost:3100"
      ORCID_CLIENT_ID: "ci-e2e"
      ORCID_CLIENT_SECRET: "ci-e2e"
      ORCID_ENVIRONMENT: "sandbox"
      OPENALEX_MAILTO: "ci@example.com"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply schema to the CI database
        run: npx prisma db push
      - name: Install Playwright (chromium)
        run: npx playwright install --with-deps chromium
      - name: Run E2E journeys
        run: npm run e2e
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
